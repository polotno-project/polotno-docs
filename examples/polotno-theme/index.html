<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta name="theme-color" content="#000000" />
    <link rel="shortcut icon" href="/favicon.ico" />

    <style>
      body {
        margin: 0;
        padding: 0;
      }
      #root {
        width: 100vw;
        height: 100vh;
      }

      /* layout: configurator bar on top, editor fills the rest.
         The bar and its controls are Polotno primitives, themed by the
         CSS variables we set on :root (see /docs/theme-and-ui-styles). */
      .app {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      .editor-wrap {
        position: relative;
        flex: 1;
        min-height: 0;
      }
      .editor-wrap .polotno-app-container {
        width: 100%;
        height: 100%;
      }
    </style>
    <title>Polotno theme configurator</title>
    <link
    href="https://unpkg.com/polotno@4/ui.css"
    rel="stylesheet"
  />
</head>

  <body>
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <div id="root"></div>
      <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
