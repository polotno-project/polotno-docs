<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta name="theme-color" content="#000000" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        margin: 0;
        padding: 0;
        color: #111827;
        background: #fff;
      }

      #root {
        width: 100vw;
        height: 100vh;
      }

      .app {
        height: 100%;
        display: flex;
        flex-direction: column;
      }

      /* --- Panes --- */
      .layout {
        flex: 1;
        display: flex;
        gap: 16px;
        padding: 16px;
        overflow: hidden;
      }

      .pane {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }

      .pane-header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
      }

      .pane-title {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: #6b7280;
        text-transform: uppercase;
      }

      .json-input {
        flex: 1;
        width: 100%;
        padding: 12px;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        font-size: 12.5px;
        font-family: ui-monospace, 'Menlo', 'Consolas', monospace;
        line-height: 1.5;
        color: #374151;
        background: #f9fafb;
        resize: none;
      }

      .json-input:focus {
        outline: none;
        border-color: #9ca3af;
        background: #fff;
      }

      .preview {
        flex: 1;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background-image:
          linear-gradient(45deg, #f3f4f6 25%, transparent 25%, transparent 75%, #f3f4f6 75%),
          linear-gradient(45deg, #f3f4f6 25%, transparent 25%, transparent 75%, #f3f4f6 75%);
        background-size: 20px 20px;
        background-position:
          0 0,
          10px 10px;
      }

      .preview img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }

      .preview-hint {
        font-size: 13px;
        color: #9ca3af;
        background: #fff;
        padding: 4px 10px;
        border-radius: 6px;
      }

      /* --- Options bar --- */
      .options-bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 20px;
        padding: 12px 16px;
        border-top: 1px solid #e5e7eb;
      }

      .field {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .field-label {
        font-size: 13px;
        color: #6b7280;
        white-space: nowrap;
      }

      /* --- Segmented format control --- */
      .segmented {
        display: inline-flex;
        background: #f3f4f6;
        border-radius: 8px;
        padding: 2px;
      }

      .segmented button {
        border: none;
        background: transparent;
        color: #4b5563;
        font-size: 12.5px;
        font-weight: 500;
        padding: 5px 12px;
        border-radius: 6px;
        cursor: pointer;
      }

      .segmented button.active {
        background: #fff;
        color: #111827;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
      }

      /* --- Selects & range --- */
      select {
        font: inherit;
        font-size: 13px;
        color: #111827;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 5px 8px;
        background: #fff;
      }

      input[type='range'] {
        width: 110px;
        accent-color: #111827;
      }

      /* --- Switch --- */
      .switch {
        position: relative;
        display: inline-flex;
      }

      .switch input {
        position: absolute;
        inset: 0;
        opacity: 0;
        margin: 0;
        cursor: pointer;
      }

      .switch-track {
        width: 32px;
        height: 18px;
        border-radius: 9px;
        background: #d1d5db;
        transition: background 0.15s;
        pointer-events: none;
      }

      .switch-track::after {
        content: '';
        position: absolute;
        top: 2px;
        left: 2px;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #fff;
        transition: transform 0.15s;
      }

      .switch input:checked + .switch-track {
        background: #111827;
      }

      .switch input:checked + .switch-track::after {
        transform: translateX(14px);
      }

      .switch--disabled {
        opacity: 0.4;
      }

      .options-bar--secondary {
        padding-top: 0;
      }

      .text-input {
        font: inherit;
        font-size: 13px;
        color: #111827;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 5px 8px;
        width: 200px;
      }

      .text-input:focus {
        outline: none;
        border-color: #9ca3af;
      }

      .more-button {
        margin-left: auto;
        border: none;
        background: transparent;
        color: #6b7280;
        font-size: 13px;
        padding: 5px 8px;
        border-radius: 6px;
        cursor: pointer;
        white-space: nowrap;
      }

      .more-button:hover {
        color: #111827;
        background: #f3f4f6;
      }

      /* --- Render button --- */
      .render-button {
        margin-left: auto;
        border: none;
        background: #111827;
        color: #fff;
        font-size: 14px;
        font-weight: 500;
        padding: 9px 20px;
        border-radius: 8px;
        cursor: pointer;
        white-space: nowrap;
      }

      .render-button:hover:not(:disabled) {
        background: #000;
      }

      .render-button:disabled {
        background: #9ca3af;
        cursor: default;
      }

      /* --- Progress line --- */
      .progress-line {
        height: 3px;
        background: #f3f4f6;
      }

      .progress-line div {
        height: 100%;
        background: #111827;
        transition: width 0.3s ease;
      }

      /* --- Errors --- */
      .error {
        color: #b91c1c;
        font-size: 12px;
        background: #fef2f2;
        padding: 2px 8px;
        border-radius: 6px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* --- Responsive --- */
      @media (max-width: 768px) {
        .layout {
          flex-direction: column;
        }

        .render-button {
          margin-left: 0;
          width: 100%;
        }
      }
    </style>
    <title>Cloud Render API Demo - Polotno</title>
  </head>

  <body>
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
